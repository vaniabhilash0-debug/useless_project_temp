<!DOCTYPE html>
<html>
<head>
    <title>Treasure Runner</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 3px solid white;
            background: #50aaff;
        }
    </style>
</head>

<body>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Player
let player = {
    x: 100,
    y: 400,
    width: 40,
    height: 40,
    speed: 5
};

// Treasure
let treasure = {
    x: Math.random() * 550 + 200,
    y: Math.random() * 300 + 100,
    width: 25,
    height: 25
};

// Obstacle
let obstacle = {
    x: 700,
    y: 400,
    width: 40,
    height: 40,
    speed: 5
};

let score = 0;

let keys = {};

document.addEventListener("keydown", function(e) {
    keys[e.key] = true;
});

document.addEventListener("keyup", function(e) {
    keys[e.key] = false;
});

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function update() {

    // Player movement
    if (keys["ArrowLeft"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"]) {
        player.x += player.speed;
    }

    if (keys["ArrowUp"]) {
        player.y -= player.speed;
    }

    if (keys["ArrowDown"]) {
        player.y += player.speed;
    }

    // Keep player inside screen
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width)
        player.x = canvas.width - player.width;

    if (player.y < 0) player.y = 0;
    if (player.y + player.height > canvas.height)
        player.y = canvas.height - player.height;

    // Obstacle movement
    obstacle.x -= obstacle.speed;

    if (obstacle.x + obstacle.width < 0) {
        obstacle.x = canvas.width;
        obstacle.y = Math.random() * 400;
    }

    // Collect treasure
    if (collision(player, treasure)) {
        score++;

        treasure.x = Math.random() * 550 + 200;
        treasure.y = Math.random() * 350 + 50;
    }

    // Game over
    if (collision(player, obstacle)) {
        alert("Game Over! Score: " + score);

        player.x = 100;
        player.y = 400;
        obstacle.x = 700;
        score = 0;
    }
}

function draw() {

    // Background
    ctx.fillStyle = "#50aaff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Player
    ctx.fillStyle = "#28a050";
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    // Treasure
    ctx.fillStyle = "#ffdc28";
    ctx.fillRect(
        treasure.x,
        treasure.y,
        treasure.width,
        treasure.height
    );

    // Obstacle
    ctx.fillStyle = "#dc3232";
    ctx.fillRect(
        obstacle.x,
        obstacle.y,
        obstacle.width,
        obstacle.height
    );

    // Score
    ctx.fillStyle = "white";
    ctx.font = "32px Arial";
    ctx.fillText("Score: " + score, 20, 40);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
